services:
  db:
    image: mysql:8.0
    container_name: pglife_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pglife
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - ./database/pglife.sql:/docker-entrypoint-initdb.d/01_base.sql
      - ./database/run_migrations.sh:/docker-entrypoint-initdb.d/02_run_migrations.sh
      - ./database:/migrations:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build: .
    container_name: pglife_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: pglife
      APP_ENV: development
      APP_URL: http://localhost:8080
      FEATURE_MOCK_KYC: "true"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: noreply@pglife.local
      SMTP_FROM_NAME: PG Life
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  mailhog:
    image: mailhog/mailhog
    container_name: pglife_mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql_data:
